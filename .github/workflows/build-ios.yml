name: Build Unsigned iOS IPA & Publish Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install npm dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Add iOS Platform & Sync Plugins
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Generate iOS App Icons
        run: |
          mkdir -p assets
          cp icon-512.png assets/icon-only.png
          cp icon-512.png assets/icon.png
          npx capacitor-assets generate --ios

      - name: Sync App Version to iOS Project
        run: |
          python3 -c "
          import os, re
          with open('package.json', 'r') as f:
              version = re.search(r'\"version\":\s*\"([^\"]+)\"', f.read()).group(1)
          pbxproj_path = 'ios/App/App.xcodeproj/project.pbxproj'
          if os.path.exists(pbxproj_path):
              with open(pbxproj_path, 'r') as f:
                  content = f.read()
              content = re.sub(r'MARKETING_VERSION\s*=\s*[^;]+;', 'MARKETING_VERSION = ' + version + ';', content)
              content = re.sub(r'CURRENT_PROJECT_VERSION\s*=\s*[^;]+;', 'CURRENT_PROJECT_VERSION = ' + version + ';', content)
              with open(pbxproj_path, 'w') as f:
                  f.write(content)
              print('Sync completed! Xcode version set to ' + version)
          "

      - name: Configure iOS App Localization (Tiếng Việt)
        run: |
          python3 -c "
          import plistlib, os
          
          # 1. Cấu hình Info.plist nhận diện Tiếng Việt là ngôn ngữ chính
          plist_path = 'ios/App/App/Info.plist'
          if os.path.exists(plist_path):
              with open(plist_path, 'rb') as f:
                  pl = plistlib.load(f)
              pl['CFBundleDevelopmentRegion'] = 'vi'
              pl['CFBundleLocalizations'] = ['vi', 'en']
              with open(plist_path, 'wb') as f:
                  plistlib.dump(pl, f)
              print('Configured Info.plist for Vietnamese localization!')

          # 2. Tạo vi.lproj để iOS nhận diện bundle Tiếng Việt chuẩn
          vi_dir = 'ios/App/App/vi.lproj'
          os.makedirs(vi_dir, exist_ok=True)
          with open(os.path.join(vi_dir, 'InfoPlist.strings'), 'w', encoding='utf-8') as f:
              f.write('CFBundleDisplayName = \"Sổ Tiền Ăn\";\nCFBundleName = \"Sổ Tiền Ăn\";\n')
          "

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install

      - name: Build Xcode Project (Unsigned)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS=ios-build-entitlements.plist \
            clean build

      - name: Sign App with Production Entitlements
        run: |
          # Đảm bảo vi.lproj có mặt trong App.app bundle
          mkdir -p build/Build/Products/Release-iphoneos/App.app/vi.lproj
          cp -f ios/App/App/vi.lproj/InfoPlist.strings build/Build/Products/Release-iphoneos/App.app/vi.lproj/ 2>/dev/null || true
          codesign --force --sign - --deep --entitlements ios-build-entitlements.plist build/Build/Products/Release-iphoneos/App.app

      - name: Verify App Entitlements
        run: |
          codesign -d --entitlements :- build/Build/Products/Release-iphoneos/App.app

      - name: Package IPA
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          mkdir -p build/Payload
          cp -r build/Build/Products/Release-iphoneos/App.app build/Payload/
          cd build
          zip -r "sotienan_v${VERSION}.ipa" Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sotienan_v${{ env.APP_VERSION }}
          path: build/sotienan_v${{ env.APP_VERSION }}.ipa

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.APP_VERSION }}"
          name: "Sổ Tiền Ăn v${{ env.APP_VERSION }}"
          body: "Bản phát hành tự động cho Sổ Tiền Ăn v${{ env.APP_VERSION }}"
          files: build/sotienan_v${{ env.APP_VERSION }}.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
